<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイトル</title>
    <link rel="stylesheet" href="CSS/style.min.css">
</head>

<body>

    <!-- グリッドシステム   -->
    <!-- フレックスボックスで横並びにする -->
    <div class="l-columns">
        <!-- コンテンツを入れるボックス -->
        <div class="l-columns__col2 l-columns--between">2</div>
        <div class="l-columns__col8">8</div>
    </div>

    <div class="l-columns">
        <div class="l-columns__col2--pc">2</div>
        <div class="l-columns__col8--pc">8</div>
    </div>
    
</body>

</html>
